<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 540" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <!-- Title / Border Header -->
  <rect x="10" y="10" width="830" height="520" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#0f172a">ŠUVJU BETONĒŠANA, DRENĀŽAS URBUMI UN KOMUNIKĀCIJU ATVĒRUMI</text>

  <!-- Joint Cross Section View -->
  <g transform="translate(40, 80)">
    <!-- Left Slab Profile -->
    <path d="M 0,0 L 260,0 C 270,30 250,80 270,160 L 0,160 Z" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="130" cy="80" r="50" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    
    <!-- Right Slab Profile -->
    <path d="M 580,0 L 320,0 C 310,30 330,80 310,160 L 580,160 Z" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="450" cy="80" r="50" fill="#ffffff" stroke="#475569" stroke-width="2"/>

    <!-- Concrete Joint Infill (Šuvju betons) -->
    <path d="M 260,0 L 320,0 C 310,30 330,80 310,160 L 270,160 C 250,80 270,30 260,0 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <text x="262" y="-10" font-size="13" font-weight="bold" fill="#0284c7">Šuvju betons (C25/35 vai C30/37)</text>

    <!-- Longitudinal Rebar in Joint (Zem viduslīnijas) -->
    <circle cx="290" cy="110" r="7" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    <line x1="295" y1="110" x2="390" y2="135" stroke="#ef4444" stroke-width="1.5"/>
    <text x="395" y="140" font-size="12" font-weight="bold" fill="#ef4444">Šuves stiegrojums (zem viduslīnijas)</text>

    <!-- Electrical Conduits (Max 2x Ø20 mm in joint) -->
    <circle cx="280" cy="40" r="6" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
    <circle cx="300" cy="40" r="6" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
    <line x1="300" y1="35" x2="380" y2="20" stroke="#78350f" stroke-width="1.5"/>
    <text x="385" y="20" font-size="12" font-weight="bold" fill="#78350f">Kabeļu caurules (max 2x Ø20 mm)</text>

    <!-- Centerline of Slab Thickness -->
    <line x1="240" y1="80" x2="340" y2="80" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="170" y="84" font-size="11" fill="#64748b">Viduslīnija</text>

    <!-- Water Drainage Hole (Drenāžas urbums) Detail at Void Bottom -->
    <!-- Drill Arrow pointing to void bottom -->
    <line x1="130" y1="130" x2="130" y2="160" stroke="#0284c7" stroke-width="3"/>
    <polygon points="130,130 125,140 135,140" fill="#0284c7"/>
    <text x="30" y="190" font-size="13" font-weight="bold" fill="#0284c7">Drenāžas urbums (Ø10 mm / Ø20 mm autostāvvietām)</text>
    <text x="30" y="205" font-size="11" fill="#334155">• Urbt katra dobuma apakšā līdz 300 mm no gala</text>
    <text x="30" y="220" font-size="11" fill="#334155">• Pārbaudīt un iztīrīt tūlīt pēc šuvju betonēšanas</text>
  </g>

  <!-- Winter Jointing & Hole Rules Box -->
  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="770" height="150" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" rx="4"/>
    <text x="20" y="25" font-size="14" font-weight="bold" fill="#c2410c">BŪTISKI NOTEIKUMI BETONĒŠANAI UN KOMUNIKĀCIJU ATVĒRUMIEM:</text>

    <text x="20" y="50" font-size="12" font-weight="bold" fill="#0f172a">1. Ziemas vuukēšana (auksts laiks):</text>
    <text x="20" y="68" font-size="11" fill="#334155">• Sniega un ledus kausēšanai šuvēs KATEGORISKI AIZLIEGTS izmantot tvaiku (tvaiks kondensējas un sasalt dobumos, iznīcinot betona saķeri).</text>
    <text x="20" y="84" font-size="11" fill="#334155">• Izmantot karsto gaisu vai gāzes degli (ja šuvēs nav plastmasas detaļu). Betona sildīšana no apakšas un termosegas.</text>

    <text x="20" y="110" font-size="12" font-weight="bold" fill="#0f172a">2. Urbumi un komunikāciju atvērumi:</text>
    <text x="20" y="128" font-size="11" fill="#334155">• Maks. 3 atveres vienā griezumā (2 atveres priekš HCE320/400). Ribas griezt drīkst TIKAI ar konstruktora saskaņojumu!</text>
    <text x="20" y="142" font-size="11" font-size="11" fill="#ef4444">• APAKŠĒJĀS RIBĀS UZURBT AIZLIEGTS (saspriegto trošu bojāšanas risks)!</text>
  </g>
</svg>
