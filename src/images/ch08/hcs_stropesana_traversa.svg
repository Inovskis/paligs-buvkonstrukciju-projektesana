<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <!-- Title / Border Header -->
  <rect x="10" y="10" width="830" height="530" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#0f172a">HCS PLĀTŅU STROPĒŠANA, TRAVERSAS UN SATVĒRĒJU POSITIONĒŠANA</text>

  <!-- Crane Hook & Upper Chains -->
  <path d="M 425,60 L 425,85" stroke="#1e293b" stroke-width="4"/>
  <circle cx="425" cy="55" r="10" fill="none" stroke="#1e293b" stroke-width="3"/>
  <path d="M 425,85 L 220,160 M 425,85 L 630,160" stroke="#334155" stroke-width="2.5"/>

  <!-- Angle arc for max 90 degrees -->
  <path d="M 370,105 A 60 60 0 0 1 480,105" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="400" y="125" font-size="13" font-weight="bold" fill="#ef4444">Leņķis ≤ 90°</text>

  <!-- Traverse Beam -->
  <rect x="180" y="160" width="490" height="25" fill="#0284c7" stroke="#0369a1" stroke-width="2" rx="3"/>
  <text x="375" y="177" font-size="13" font-weight="bold" fill="#ffffff">Celšanas traversa</text>

  <!-- Lower Chains from Traverse to Clamps -->
  <line x1="220" y1="185" x2="220" y2="280" stroke="#334155" stroke-width="2.5"/>
  <line x1="630" y1="185" x2="630" y2="280" stroke="#334155" stroke-width="2.5"/>

  <!-- Concrete HCS Slab -->
  <rect x="80" y="320" width="690" height="70" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" rx="3"/>
  <!-- Hollow cores (circles in elevation) -->
  <circle cx="120" cy="355" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="170" cy="355" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="220" cy="355" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="630" cy="355" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="680" cy="355" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="730" cy="355" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Left Lifting Clamp (Haarats) -->
  <rect x="200" y="280" width="40" height="40" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
  <path d="M 195,320 L 245,320 L 240,360 L 200,360 Z" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>

  <!-- Right Lifting Clamp (Haarats) -->
  <rect x="610" y="280" width="40" height="40" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
  <path d="M 605,320 L 655,320 L 650,360 L 610,360 Z" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>

  <!-- Safety Chain (Ohutuskett) -->
  <path d="M 220,320 Q 220,410 425,410 Q 630,410 630,320" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="350" y="425" font-size="13" font-weight="bold" fill="#ef4444">Drošības ķēde (obligāta! uzliek pie H ≤ 100 mm)</text>

  <!-- Dimension line for clamp offset 'a' -->
  <line x1="80" y1="450" x2="80" y2="490" stroke="#0f172a" stroke-width="1"/>
  <line x1="220" y1="450" x2="220" y2="490" stroke="#0f172a" stroke-width="1"/>
  <line x1="80" y1="470" x2="220" y2="470" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="80,470 90,465 90,475" fill="#0f172a"/>
  <polygon points="220,470 210,465 210,475" fill="#0f172a"/>
  <text x="110" y="465" font-size="13" font-weight="bold" fill="#0f172a">Attālums 'a'</text>
  <text x="75" y="510" font-size="11" fill="#334155">≤ 5 troses: a ≤ 1500 mm</text>
  <text x="75" y="525" font-size="11" fill="#334155">6-7 troses: a ≤ 1300 mm</text>
  <text x="240" y="510" font-size="11" fill="#334155">8-9 troses: a ≤ 1150 mm</text>
  <text x="240" y="525" font-size="11" fill="#334155">≥ 10 troses: a ≤ 750 mm</text>

  <!-- Legend Note for Short Slabs -->
  <rect x="520" y="450" width="280" height="70" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
  <text x="530" y="470" font-size="12" font-weight="bold" fill="#0f172a">Celšana bez traversas:</text>
  <text x="530" y="490" font-size="11" fill="#334155">• Tikai plātnēm ar garumu L &lt; 3 m</text>
  <text x="530" y="508" font-size="11" fill="#334155">• Ķēžu leņķis starpā ≤ 10°</text>
</svg>
