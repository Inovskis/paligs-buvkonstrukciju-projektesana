<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <!-- Title / Border Header -->
  <rect x="10" y="10" width="830" height="480" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#0f172a">PAGAIDU BALSTĪŠANA UN TĒRAUDA VEKSEĻI (AIĻU MEZGLI)</text>

  <!-- 3D Axonometric / Isometric View of Opening with Trimmer Beam -->
  <g transform="translate(60, 70)">
    <!-- Full Slab Left -->
    <polygon points="40,80 240,40 240,300 40,340" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
    <text x="100" y="180" font-size="13" font-weight="bold" fill="#334155">Pilna plātne</text>

    <!-- Full Slab Right -->
    <polygon points="500,40 700,80 700,340 500,300" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
    <text x="560" y="180" font-size="13" font-weight="bold" fill="#334155">Pilna plātne</text>

    <!-- Opening (Aile) in Middle -->
    <polygon points="240,40 500,40 500,160 240,160" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="330" y="100" font-size="16" font-weight="bold" fill="#94a3b8">Kāpņu / šahtas aile</text>

    <!-- Shortened Slab (Saīsinātā plātne) -->
    <polygon points="240,160 500,160 500,300 240,300" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"/>
    <text x="310" y="240" font-size="13" font-weight="bold" fill="#0f172a">Saīsinātā HCS plātne</text>

    <!-- Steel Trimmer Beam (Tērauda vekselis) -->
    <rect x="230" y="150" width="280" height="20" fill="#ef4444" stroke="#991b1b" stroke-width="2" rx="2"/>
    <text x="270" y="140" font-size="13" font-weight="bold" fill="#ef4444">Tērauda vekselis (sija saīsinātās plātnes balstīšanai)</text>

    <!-- Temporary Props (Montāžas balstīšana) -->
    <line x1="270" y1="300" x2="270" y2="390" stroke="#0284c7" stroke-width="3"/>
    <line x1="470" y1="300" x2="470" y2="390" stroke="#0284c7" stroke-width="3"/>
    <text x="310" y="380" font-size="13" font-weight="bold" fill="#0284c7">Pagaidu montāžas balsti (stutes)</text>
  </g>

  <!-- Explanatory Box -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="720" height="55" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="4"/>
    <text x="15" y="22" font-size="12" font-weight="bold" fill="#0369a1">KĀ STRĀDĀ TĒRAUDA VEKSELIS:</text>
    <text x="15" y="42" font-size="11" fill="#0f172a">Montāžas laikā vekselis pārnes saīsinātās plātnes slodzi uz blakus esošajām pilnajām plātnēm. Pagaidu balstus noņem tikai pēc šuvju betona sacietēšanas.</text>
  </g>
</svg>
