<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <!-- Title / Border Header -->
  <rect x="10" y="10" width="830" height="500" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#0f172a">PLĀTŅU IZLIEČU (BŪVBULTU) IZLĪDZINĀŠANA UN PAGAIDU BALSTĪŠANA</text>

  <!-- Left Support (Wall/Beam) -->
  <rect x="50" y="280" width="100" height="120" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <text x="70" y="350" font-size="12" font-weight="bold" fill="#334155">Balsts</text>

  <!-- Right Support (Wall/Beam) -->
  <rect x="700" y="280" width="100" height="120" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <text x="720" y="350" font-size="12" font-weight="bold" fill="#334155">Balsts</text>

  <!-- Curved HCS Slab (Slab with Camber / Būvbulta) -->
  <path d="M 80,265 Q 425,230 770,265 L 770,280 Q 425,245 80,280 Z" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.5"/>
  <text x="380" y="220" font-size="14" font-weight="bold" fill="#0284c7">Plātnes izliece (būvbulta)</text>

  <!-- Anti-displacement Wedges at Supports -->
  <polygon points="70,270 80,250 80,270" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>
  <polygon points="780,270 770,250 770,270" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>
  
  <line x1="75" y1="240" x2="140" y2="190" stroke="#ef4444" stroke-width="1.5"/>
  <text x="145" y="185" font-size="12" font-weight="bold" fill="#ef4444">Ķīļi gala šuvēs (novērš noslīdēšanu no balsta)</text>

  <!-- Levelling Telescopic Screw Prop under Center / 2nd Rib -->
  <rect x="415" y="245" width="20" height="20" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
  <!-- Timber distribution beam -->
  <rect x="360" y="260" width="130" height="15" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
  
  <!-- Prop Pipe -->
  <rect x="420" y="275" width="10" height="150" fill="#64748b" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="410" y="340" width="30" height="15" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <text x="445" y="352" font-size="12" font-weight="bold" fill="#0284c7">Regulēšanas uzgrieznis</text>

  <!-- Base of Prop -->
  <rect x="380" y="425" width="90" height="15" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="350" y1="440" x2="500" y2="440" stroke="#0f172a" stroke-width="2"/>

  <!-- Rules Box -->
  <g transform="translate(50, 445)">
    <rect x="0" y="0" width="750" height="55" fill="#fff7ed" stroke="#fdba74" stroke-width="1" rx="4"/>
    <text x="15" y="20" font-size="12" font-weight="bold" fill="#c2410c">SVARĪGI IZLĪDZINĀŠANAS NOTEIKUMI:</text>
    <text x="15" y="40" font-size="11" fill="#431407">1. Maks. izlīdzināšana: ≤ 1 mm uz 1 m plātnes garuma | 2. AIZLIEGTS noslogot ar būvmateriāliem vai spiest ar celtni | 3. Balstus noņem TIKAI pēc šuvju betona sacietēšanas</text>
  </g>
</svg>
