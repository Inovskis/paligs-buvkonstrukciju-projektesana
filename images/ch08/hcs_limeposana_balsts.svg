<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <!-- Title / Border Header -->
  <rect x="10" y="10" width="830" height="480" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#0f172a">HCS PLĀTŅU BALSTĪŠANA UN LĪMEŅOŠANA (PLĀKSNĪŠU NOVIETOŠANA ZEM 2. RIBAS)</text>

  <!-- Cross-section of HCS Slab -->
  <g transform="translate(60, 100)">
    <!-- Outer Contour of HCS Slab -->
    <path d="M 0,0 L 720,0 Q 730,70 720,140 L 0,140 Q -10,70 0,0 Z" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.5"/>
    
    <!-- 5 Circular Voids -->
    <circle cx="80" cy="70" r="45" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <circle cx="210" cy="70" r="45" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <circle cx="360" cy="70" r="45" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <circle cx="510" cy="70" r="45" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <circle cx="640" cy="70" r="45" fill="#ffffff" stroke="#475569" stroke-width="2"/>

    <!-- Shim Plates (Līmeņošanas plāksnītes) UNDER 2ND RIB from each side -->
    <!-- 2nd rib left: X = 145 mm (between void 1 and void 2) -->
    <rect x="130" y="140" width="30" height="20" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    <line x1="130" y1="140" x2="160" y2="160" stroke="#ffffff" stroke-width="1"/>
    
    <!-- 2nd rib right: X = 575 mm (between void 4 and void 5) -->
    <rect x="560" y="140" width="30" height="20" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    <line x1="560" y1="140" x2="590" y2="160" stroke="#ffffff" stroke-width="1"/>

    <!-- Bedding Mortar Layer -->
    <rect x="0" y="140" width="130" height="20" fill="#cbd5e1" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <rect x="160" y="140" width="400" height="20" fill="#cbd5e1" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <rect x="590" y="140" width="130" height="20" fill="#cbd5e1" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Support Structure (Wall / Beam under mortar) -->
    <rect x="0" y="160" width="720" height="50" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="260" y="190" font-size="14" font-weight="bold" fill="#334155">Nesošā sija vai mūra / betona siena</text>

    <!-- Dimension C (Left offset to 2nd rib) -->
    <line x1="0" y1="220" x2="0" y2="255" stroke="#0f172a" stroke-width="1"/>
    <line x1="145" y1="220" x2="145" y2="255" stroke="#0f172a" stroke-width="1"/>
    <line x1="0" y1="240" x2="145" y2="240" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="0,240 10,235 10,245" fill="#0f172a"/>
    <polygon points="145,240 135,235 135,245" fill="#0f172a"/>
    <text x="50" y="233" font-size="13" font-weight="bold" fill="#0f172a">c</text>

    <!-- Dimension D (Distance between the two 2nd ribs) -->
    <line x1="145" y1="240" x2="575" y2="240" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="145,240 155,235 155,245" fill="#0f172a"/>
    <polygon points="575,240 565,235 565,245" fill="#0f172a"/>
    <text x="350" y="233" font-size="13" font-weight="bold" fill="#0f172a">d</text>

    <!-- Dimension C (Right offset) -->
    <line x1="575" y1="220" x2="575" y2="255" stroke="#0f172a" stroke-width="1"/>
    <line x1="720" y1="220" x2="720" y2="255" stroke="#0f172a" stroke-width="1"/>
    <line x1="575" y1="240" x2="720" y2="240" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="575,240 585,235 585,245" fill="#0f172a"/>
    <polygon points="720,240 710,235 710,245" fill="#0f172a"/>
    <text x="640" y="233" font-size="13" font-weight="bold" fill="#0f172a">c</text>

    <!-- Mortar joint height dimension (>= 15 mm) -->
    <line x1="730" y1="140" x2="775" y2="140" stroke="#ef4444" stroke-width="1"/>
    <line x1="730" y1="160" x2="775" y2="160" stroke="#ef4444" stroke-width="1"/>
    <line x1="755" y1="140" x2="755" y2="160" stroke="#ef4444" stroke-width="1.5"/>
    <polygon points="755,140 750,148 760,148" fill="#ef4444"/>
    <polygon points="755,160 750,152 760,152" fill="#ef4444"/>
    <text x="765" y="154" font-size="11" font-weight="bold" fill="#ef4444">≥ 15 mm</text>
  </g>

  <!-- Table of Offsets C & D -->
  <g transform="translate(60, 370)">
    <rect x="0" y="0" width="720" height="100" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <text x="15" y="25" font-size="13" font-weight="bold" fill="#0f172a">Līmeņošanas plāksnīšu (50 x 75 mm) novietojuma izmēri:</text>
    
    <text x="25" y="50" font-size="12" font-weight="bold" fill="#0369a1">• HCE200 un HCE220:</text>
    <text x="200" y="50" font-size="12" fill="#1e293b">c = 220 mm, d = 760 mm</text>

    <text x="25" y="70" font-size="12" font-weight="bold" fill="#0369a1">• HCE265:</text>
    <text x="200" y="70" font-size="12" fill="#1e293b">c = 260 mm, d = 680 mm</text>

    <text x="400" y="50" font-size="12" font-weight="bold" fill="#0369a1">• HCE320 un HCE400:</text>
    <text x="580" y="50" font-size="12" fill="#1e293b">c = 320 mm, d = 560 mm</text>

    <text x="400" y="75" font-size="11" font-weight="bold" fill="#ef4444">KATEGORISKI AIZLIEGTS plāksnītes likt zem plānās dobuma apakšas!</text>
  </g>
</svg>
