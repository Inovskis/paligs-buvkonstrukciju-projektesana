<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  <!-- Title / Border Header -->
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#0f172a">HCS PLĀTŅU UZGLABĀŠANA BŪVLAUKUMĀ (MAX 4 STĀVI)</text>
  
  <!-- Ground Line -->
  <line x1="50" y1="420" x2="750" y2="420" stroke="#334155" stroke-width="3"/>
  <!-- Hatching for ground -->
  <path d="M 60,420 L 50,435 M 90,420 L 80,435 M 120,420 L 110,435 M 150,420 L 140,435 M 180,420 L 170,435 M 210,420 L 200,435 M 240,420 L 230,435 M 270,420 L 260,435 M 300,420 L 290,435 M 330,420 L 320,435 M 360,420 L 350,435 M 390,420 L 380,435 M 420,420 L 410,435 M 450,420 L 440,435 M 480,420 L 470,435 M 510,420 L 500,435 M 540,420 L 530,435 M 570,420 L 560,435 M 610,420 L 600,435 M 650,420 L 640,435 M 690,420 L 680,435 M 730,420 L 720,435" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="445" font-size="13" font-weight="bold" fill="#475569">Cietas, izlīdzinātas pamatnes virsma</text>

  <!-- Base Timber Blocks (Ground level) -->
  <!-- Left Base Block -->
  <rect x="220" y="380" width="40" height="40" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
  <line x1="220" y1="380" x2="260" y2="420" stroke="#78350f" stroke-width="1"/>
  <line x1="260" y1="380" x2="220" y2="420" stroke="#78350f" stroke-width="1"/>

  <!-- Right Base Block -->
  <rect x="620" y="380" width="40" height="40" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
  <line x1="620" y1="380" x2="660" y2="420" stroke="#78350f" stroke-width="1"/>
  <line x1="660" y1="380" x2="620" y2="420" stroke="#78350f" stroke-width="1"/>

  <!-- Slab 1 (Bottom) -->
  <rect x="150" y="325" width="550" height="55" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" rx="2"/>
  <!-- Hollow cores representation -->
  <line x1="150" y1="352" x2="700" y2="352" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Timber Spacer 1-2 -->
  <rect x="220" y="310" width="40" height="15" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
  <rect x="620" y="310" width="40" height="15" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>

  <!-- Slab 2 -->
  <rect x="150" y="255" width="550" height="55" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" rx="2"/>
  <line x1="150" y1="282" x2="700" y2="282" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Timber Spacer 2-3 -->
  <rect x="220" y="240" width="40" height="15" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
  <rect x="620" y="240" width="40" height="15" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>

  <!-- Slab 3 -->
  <rect x="150" y="185" width="550" height="55" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" rx="2"/>
  <line x1="150" y1="212" x2="700" y2="212" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Timber Spacer 3-4 -->
  <rect x="220" y="170" width="40" height="15" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
  <rect x="620" y="170" width="40" height="15" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>

  <!-- Slab 4 (Top) -->
  <rect x="150" y="115" width="550" height="55" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" rx="2"/>
  <line x1="150" y1="142" x2="700" y2="142" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Alignment Centerline for Timber Supports -->
  <line x1="240" y1="80" x2="240" y2="430" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="640" y1="80" x2="640" y2="430" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="180" y="70" font-size="12" font-weight="bold" fill="#ef4444">Vertikālā izlīdzinājuma ass</text>

  <!-- Dimension 1: Distance from slab end to support -->
  <line x1="150" y1="95" x2="150" y2="60" stroke="#0f172a" stroke-width="1"/>
  <line x1="240" y1="95" x2="240" y2="60" stroke="#0f172a" stroke-width="1"/>
  <line x1="150" y1="75" x2="240" y2="75" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="150,75 160,70 160,80" fill="#0f172a"/>
  <polygon points="240,75 230,70 230,80" fill="#0f172a"/>
  <text x="160" y="65" font-size="12" font-weight="bold" fill="#0f172a">≤ 300 mm</text>

  <!-- Dimension 2: Ground clearance under bottom slab -->
  <line x1="80" y1="380" x2="140" y2="380" stroke="#0f172a" stroke-width="1"/>
  <line x1="80" y1="420" x2="140" y2="420" stroke="#0f172a" stroke-width="1"/>
  <line x1="100" y1="380" x2="100" y2="420" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="100,380 95,390 105,390" fill="#0f172a"/>
  <polygon points="100,420 95,410 105,410" fill="#0f172a"/>
  <text x="25" y="405" font-size="12" font-weight="bold" fill="#0f172a">≥ 200 mm</text>

  <!-- Dimension 3: Timber spacer thickness -->
  <line x1="710" y1="310" x2="760" y2="310" stroke="#0f172a" stroke-width="1"/>
  <line x1="710" y1="325" x2="760" y2="325" stroke="#0f172a" stroke-width="1"/>
  <line x1="740" y1="310" x2="740" y2="325" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="740,310 735,316 745,316" fill="#0f172a"/>
  <polygon points="740,325 735,319 745,319" fill="#0f172a"/>
  <text x="748" y="322" font-size="11" font-weight="bold" fill="#0f172a">≥ 50 mm</text>

  <!-- Labels -->
  <text x="310" y="300" font-size="12" font-weight="bold" fill="#0369a1">Koka starplikas (vienā vertikālē)</text>
  <text x="340" y="145" font-size="13" font-weight="bold" fill="#1e293b">Maks. 4 plātnes vienā kaudzē</text>
</svg>
