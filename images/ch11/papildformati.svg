<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" width="100%" height="100%" role="img" aria-labelledby="t d" style="background-color:#ffffff; font-family:'Public Sans','Segoe UI',Arial,sans-serif;">
  <title id="t">A sērijas pamatformāti un papildformāti</title>
  <desc id="d">Pamatformāti A0–A4 un papildformāti A1.0, A2.1, A2.0, A3.2, A3.1, A3.0 mērogā; izmēri milimetros (LVS EN ISO 5457).</desc>
  <!-- Mērogs: 1 mm = 0.5 px; sākumpunkts (0;0) = (50;440) -->
  <rect x="0" y="0" width="690" height="470" fill="#FFFFFF"/>

  <g fill="none" stroke="#1A1C1E" stroke-width="1.3">
    <!-- A0 kontūra -->
    <rect x="50" y="19.5" width="594.5" height="420.5"/>
    <!-- A1: augšmala 594, labā mala 841 -->
    <line x1="50" y1="143" x2="470.5" y2="143"/>
    <line x1="470.5" y1="143" x2="470.5" y2="440"/>
    <!-- A2: augšmala 420, labā mala 594 -->
    <line x1="50" y1="230" x2="347" y2="230"/>
    <line x1="347" y1="230" x2="347" y2="440"/>
    <!-- A3 / A4: augšmala 297, labās malas 420 un 210 -->
    <line x1="50" y1="291.5" x2="260" y2="291.5"/>
    <line x1="260" y1="291.5" x2="260" y2="440"/>
    <line x1="155" y1="291.5" x2="155" y2="440"/>
  </g>

  <!-- Papildformātu robežas (pārtrauktas līnijas) -->
  <g fill="none" stroke="#1A1C1E" stroke-width="1.1" stroke-dasharray="9 6">
    <line x1="470.5" y1="143" x2="644.5" y2="143"/>
    <line x1="347" y1="230" x2="644.5" y2="230"/>
    <line x1="260" y1="291.5" x2="644.5" y2="291.5"/>
  </g>

  <!-- Formātu apzīmējumi -->
  <g font-size="14" font-weight="600" fill="#1A1C1E" text-anchor="end">
    <text x="636" y="40">A0</text>
    <text x="462" y="164">A1</text>
    <text x="339" y="251">A2</text>
    <text x="252" y="312">A3</text>
    <text x="147" y="312">A4</text>
  </g>
  <g font-size="14" font-weight="600" fill="#1D4E89" text-anchor="end">
    <text x="636" y="164">A1.0</text>
    <text x="462" y="251">A2.1</text>
    <text x="636" y="251">A2.0</text>
    <text x="339" y="312">A3.2</text>
    <text x="462" y="312">A3.1</text>
    <text x="636" y="312">A3.0</text>
  </g>

  <!-- Asu iedaļas, mm -->
  <g font-size="12" fill="#4A525C">
    <g text-anchor="middle">
      <text x="50" y="460">0</text>
      <text x="155" y="460">210</text>
      <text x="260" y="460">420</text>
      <text x="347" y="460">594</text>
      <text x="470.5" y="460">841</text>
      <text x="644.5" y="460">1189</text>
    </g>
    <g text-anchor="end">
      <text x="42" y="23.5">841</text>
      <text x="42" y="147">594</text>
      <text x="42" y="234">420</text>
      <text x="42" y="295.5">297</text>
    </g>
  </g>
</svg>
